name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Dependency Check
        run: mvn -B dependency:check
      - name: Build
        run: mvn -B clean compile
      - name: Test
        run: mvn -B test
      - name: Package
        run: mvn -B package -DskipTests
      - name: Security Scan (Basic)
        run: |
          echo "Checking for hardcoded secrets..."
          grep -rni "password\|secret\|token" src/main/resources/ || true
      - name: Dependency Scan
        run: mvn -B dependency:analyze
