spring.application.name=proxy-subscription-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/proxy_subscription
spring.datasource.username=proxy_user
spring.datasource.password=proxy_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Server
server.port=8080

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.level.com.proxy.subscription=INFO

# Payment instructions (manual card-to-card)
payment.bank.name=
payment.bank.card.number=
payment.bank.account.holder=
payment.instructions.text=Please transfer the exact amount to the bank card below and upload a clear image of the receipt.

# External subscription service (3x-ui) configuration
subscription.service.url=
subscription.service.username=
subscription.service.password=
subscription.service.base.path=/panel/api

# Admin allowlist (comma-separated Telegram user IDs)
admin.telegram.ids=

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
