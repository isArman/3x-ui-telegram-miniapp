global
    daemon
    maxconn 4096

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    option forwardfor
    option http-server-close

frontend https_frontend
    bind *:443 ssl crt /etc/haproxy/certs/
    acl is_api path_beg /api-docs /health /plans /orders /receipts /admin
    acl is_sub path_beg /sub
    use_backend backend_api if is_api is_sub
    default_backend backend_api

backend backend_api
    server backend1 localhost:8080 check
